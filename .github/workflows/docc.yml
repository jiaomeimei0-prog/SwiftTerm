name: Publish DocC

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check GitHub Pages
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/pages-response.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" || true)"
          if [ "${code}" = "200" ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
            echo "GitHub Pages is configured; DocC will be uploaded and deployed."
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "GitHub Pages is not configured (HTTP ${code})."
            echo "DocC will still be generated; Pages configure/upload/deploy will be skipped."
            if [ -f /tmp/pages-response.json ]; then
              head -c 500 /tmp/pages-response.json || true
              echo
            fi
          fi

      - name: Configure Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Generate DocC
        env:
          SWIFTTERM_DOCC: "1"
        run: |
          mkdir -p docs
          swift package --allow-writing-to-directory "$PWD/docs" generate-documentation \
            --target SwiftTerm \
            --output-path ./docs \
            --transform-for-static-hosting \
            --hosting-base-path "${{ github.event.repository.name }}"

      - name: Add redirect index.html
        run: |
          docc_root="./docs"
          docc_section="$(ls -1 "${docc_root}/documentation" | head -n 1)"
          if [ -z "${docc_section}" ]; then
            echo "No documentation section found in ${docc_root}/documentation" >&2
            exit 1
          fi

          cat > "${docc_root}/index.html" <<EOF
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta http-equiv="refresh" content="0; url=documentation/${docc_section}/" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Redirecting...</title>
              <link rel="canonical" href="documentation/${docc_section}/" />
            </head>
            <body>
              <p>Redirecting to <a href="documentation/${docc_section}/">documentation</a>.</p>
            </body>
          </html>
          EOF

      - name: Upload Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
