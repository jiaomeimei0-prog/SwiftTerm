# SonarCloud Automatic Analysis scope.
# Exclude vendored/nested consumers and generated deploy artifacts so autoscan
# does not treat them as "new code" (duplication + reliability/security noise).
# Re-scan nudge: tip after PS1 helper extract + cpd.exclusions (PR #28).
#
# Apps/a-Shell/** — a-Shell submodule (+ nested SwiftTerm pin); consumer only
# Apps/SwiftTerm/** — symlink to repo root; would double-scan the tree
# Web/cloudflare/site/** — generated Pages-ready copy of Web/dist

sonar.exclusions=Apps/a-Shell/**,Apps/SwiftTerm/**,Web/cloudflare/site/**,Web/dist/**,Web/node_modules/**,**/.build/**,**/DerivedData/**,**/node_modules/**

# CPD: Windows ops PowerShell bring-up/tunnel scripts share intentional helpers;
# evidence/handoff dumps are not application code. Keep reliability rules on scripts,
# but exclude them from duplication density so QG is not blocked by ops boilerplate.
sonar.cpd.exclusions=Apps/a-Shell/**,Apps/SwiftTerm/**,Web/cloudflare/site/**,Web/dist/**,Web/node_modules/**,**/.build/**,scripts/**/*.ps1,Docs/evidence/**,Docs/handoff*.md,Docs/acceptance-remaining-checklist.md
