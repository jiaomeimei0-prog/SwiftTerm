# SonarCloud Automatic Analysis scope.
# Exclude vendored/nested consumers and generated deploy artifacts so autoscan
# does not treat them as "new code" (duplication + reliability/security noise).
#
# Apps/a-Shell/** — a-Shell submodule (+ nested SwiftTerm pin); consumer only
# Apps/SwiftTerm/** — symlink to repo root; would double-scan the tree
# Web/cloudflare/site/** — generated Pages-ready copy of Web/dist
# Docs/evidence/** — generated probe dumps, not library code
# Docs/audit/** — generated by scripts/audit/run_audit.py (reports + CSV/JSON); the generator itself stays analysed

sonar.exclusions=Apps/a-Shell/**,Apps/SwiftTerm/**,Web/cloudflare/site/**,Web/dist/**,Web/node_modules/**,**/.build/**,**/DerivedData/**,**/node_modules/**,Docs/evidence/**,Docs/audit/**

# CPD only for Windows PowerShell tunnel/bring-up ops (shared helpers / boilerplate).
# Do NOT put scripts/** in sonar.exclusions — that tree also has Python/JS/shell tooling.
sonar.cpd.exclusions=Apps/a-Shell/**,Apps/SwiftTerm/**,Web/cloudflare/site/**,Web/dist/**,Web/node_modules/**,**/.build/**,scripts/**/*.ps1,Docs/handoff*.md,Docs/acceptance-remaining-checklist.md
