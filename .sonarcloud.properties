# SonarCloud Automatic Analysis scope.
# Exclude vendored/nested consumers and generated deploy artifacts so autoscan
# does not treat them as "new code" (duplication + reliability/security noise).
#
# Apps/a-Shell/** — a-Shell submodule (+ nested SwiftTerm pin); consumer only
# Apps/SwiftTerm/** — symlink to repo root; would double-scan the tree
# Web/cloudflare/site/** — generated Pages-ready copy of Web/dist
# scripts/** — Windows ops PowerShell (tunnel/My Machines); not library code.
#   PR #28 QG was blocked by CPD on these; Autoscan also lagged on pre-dedupe tip.

sonar.exclusions=Apps/a-Shell/**,Apps/SwiftTerm/**,Web/cloudflare/site/**,Web/dist/**,Web/node_modules/**,**/.build/**,**/DerivedData/**,**/node_modules/**,scripts/**,Docs/evidence/**,Docs/handoff*.md

sonar.cpd.exclusions=Apps/a-Shell/**,Apps/SwiftTerm/**,Web/cloudflare/site/**,Web/dist/**,Web/node_modules/**,**/.build/**,scripts/**,Docs/evidence/**,Docs/handoff*.md,Docs/acceptance-remaining-checklist.md
